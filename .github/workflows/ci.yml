name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: linkedin_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest pytest-mock
        
    - name: Run Ruff Linting
      run: |
        # In a real scenario we might fail on ruff errors, for take-home we just show it.
        ruff check . || true
        
    - name: Initialize Database Schema
      run: |
        PGPASSWORD=admin psql -h localhost -U admin -d linkedin_analytics -f db/schema/init.sql
        
    - name: Generate Synthetic Data
      run: |
        python datagen/generate_events.py
        
    - name: Run Pytest
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: linkedin_analytics
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: admin
      run: |
        pytest tests/
